<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civil Engineering Idle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game">

    <!-- Panorama = the permanent gallery (DESIGN §4). One zone per completed
         structure; reset never touches it. Rendered from state.gallery. -->
    <div id="panorama"></div>

    <!-- Resource bar: this level's raw + refined, plus Reputation. Rendered
         from the level definition so it follows the level, not hardcoded. -->
    <div id="resources"></div>

    <!-- Three tabs from the start (DESIGN §9 Stage 1) -->
    <nav id="tabs">
      <button class="tab active" data-tab="extract">Extract</button>
      <button class="tab" data-tab="process">Process</button>
      <button class="tab" data-tab="build">Build</button>
    </nav>

    <section class="panel" id="tab-extract">
      <div id="manual">
        <button id="tap-dig">Break Ground</button>
      </div>
      <h3>Crew</h3>
      <div id="worker-list"></div>
    </section>

    <section class="panel hidden" id="tab-process">
      <h3>Processing</h3>
      <div id="building-list"></div>
      <p class="empty-note" id="process-empty">
        Nothing to process yet — hire Laborers to get raw material moving.
      </p>
    </section>

    <section class="panel hidden" id="tab-build">
      <h3>Structure</h3>
      <div id="structure-card"></div>
      <h3>Reputation</h3>
      <div id="rep-list"></div>
    </section>

    <!-- Debug panel: invaluable for tuning the placeholder cost curve -->
    <div id="debug">
      <h4>Debug</h4>
      <button id="debug-reset">Wipe</button>
      <button id="debug-resources">+1000</button>
      <button id="debug-rep">+10 Rep</button>
      <label>Speed:
        <select id="debug-speed">
          <option value="1">1x</option>
          <option value="5">5x</option>
          <option value="25">25x</option>
          <option value="100">100x</option>
        </select>
      </label>
      <div>Run: <span id="debug-runtime">0s</span></div>
      <div>Extract: <span id="debug-rate">0/s</span></div>
    </div>

    <div id="toast"></div>

  </div>
  <script src="game.js"></script>
</body>
</html>
